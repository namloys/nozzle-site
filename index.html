<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nozzle Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* 🔹 ส่วนแถบเมนู */
        .navbar {
            background-color: #004d99;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .navbar a {
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar a:hover {
            background-color: #0066cc;
        }

        /* 🔹 เนื้อหาหลัก */
        .content {
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: #004d99;
        }
    </style>
</head>
<body>

    <!-- 🔹 แถบเมนูแนวนอน -->
    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">Nozzle Types</a>
        <a href="#">Maintenance</a>
        <a href="#">Contact</a>
    </div>

    <!-- 🔹 เนื้อหา -->
    <div class="content">
        <h1>Nozzle Information Summary</h1>

        <table>
            <tr>
                <th>Type</th>
                <th>Size Range (mm)</th>
                <th>Standard Shot Life</th>
            </tr>
            <tr>
                <td>Standard Round</td>
                <td>0.3 – 2.0</td>
                <td>~3–5 million shots</td>
            </tr>
            <tr>
                <td>Chip Nozzle</td>
                <td>0.1 – 1.0</td>
                <td>~2–3 million shots</td>
            </tr>
            <tr>
                <td>Special Shape</td>
                <td>Custom</td>
                <td>~1–2 million shots</td>
            </tr>
            <tr>
                <td>Vacuum Nozzle</td>
                <td>0.5 – 3.0</td>
                <td>~3 million shots</td>
            </tr>
        </table>
    </div>

</body>
</html>
